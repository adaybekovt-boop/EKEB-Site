<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ЕКЕБ — мобильный предпросмотр</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f7f8f8;
        background:
          radial-gradient(circle at 20% 10%, rgba(97,120,245,.18), transparent 35%),
          radial-gradient(circle at 80% 90%, rgba(212,165,116,.10), transparent 35%),
          #08090a;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      .stage { display: grid; justify-items: center; gap: 14px; padding: 18px; }
      .toolbar {
        width: min(390px, calc(100vw - 32px));
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: rgba(255,255,255,.55);
        font-size: 12px;
      }
      .status { display: inline-flex; align-items: center; gap: 7px; }
      .status::before {
        content: "";
        width: 7px; height: 7px; border-radius: 50%;
        background: #6178f5;
        box-shadow: 0 0 16px rgba(97,120,245,.9);
      }
      button {
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 999px;
        padding: 7px 11px;
        color: #f7f8f8;
        background: rgba(255,255,255,.05);
        cursor: pointer;
      }
      .phone {
        position: relative;
        width: 390px;
        height: 844px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.16);
        border-radius: 42px;
        background: #08090a;
        box-shadow: 0 40px 120px rgba(0,0,0,.65), 0 0 0 7px rgba(255,255,255,.035);
        transform-origin: top center;
      }
      .speaker {
        position: absolute;
        z-index: 2;
        top: 9px; left: 50%;
        width: 88px; height: 23px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #030405;
        pointer-events: none;
      }
      iframe { display: block; width: 390px; height: 844px; border: 0; background: #08090a; }
      @media (max-height: 930px) {
        .phone { transform: scale(.82); }
        .stage { height: 100vh; align-content: start; }
      }
      @media (max-height: 760px) { .phone { transform: scale(.66); } }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="toolbar">
        <span class="status">Мобильный viewport · 390 × 844</span>
        <button type="button" onclick="document.querySelector('iframe').contentWindow.location.reload()">Обновить</button>
      </div>
      <div class="phone">
        <div class="speaker"></div>
        <iframe src="http://127.0.0.1:3001/" title="Мобильная версия ЕКЕБ"></iframe>
      </div>
    </main>
  </body>
</html>
